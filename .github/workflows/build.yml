name: Build resume

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile main.tex with latexmk (pdflatex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_shell_escape: false

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: main.pdf
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled PDF
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Rename PDF for release
        run: cp main.pdf resume.pdf

      - name: Build flat Overleaf template zip
        run: |
          mkdir -p dist
          zip -j dist/overleaf-template.zip main.tex altacv.cls sample.bib
          unzip -l dist/overleaf-template.zip

      - name: Install poppler-utils for preview rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render first-page preview PNG
        run: |
          pdftoppm -png -singlefile -r 150 -f 1 -l 1 main.pdf preview
          mv preview.png dist/preview.png

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            resume.pdf
            dist/overleaf-template.zip
            dist/preview.png
          generate_release_notes: true
